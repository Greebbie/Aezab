# Optional platform database. This does not configure business-data connections.
# Set AEZAB_POSTGRES_PASSWORD to a generated URL-safe secret in .env first.
services:
  server:
    environment:
      AEZAB_DATABASE_URL: postgresql+asyncpg://aezab:${AEZAB_POSTGRES_PASSWORD:?Set a URL-safe AEZAB_POSTGRES_PASSWORD in .env}@postgres:5432/aezab
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aezab
      POSTGRES_USER: aezab
      POSTGRES_PASSWORD: ${AEZAB_POSTGRES_PASSWORD:?Set AEZAB_POSTGRES_PASSWORD in .env}
    volumes:
      - aezab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aezab -d aezab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aezab-postgres:
